<!-- templates/reminder.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reminder</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background: #4F46E5; color: white; padding: 20px; }
        .content { padding: 20px; }
        .footer { background: #f3f4f6; padding: 20px; font-size: 12px; }
        .button {
            background: #4F46E5;
            color: white !important;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MyDones Reminder</h1>
        </div>
        <div class="content">
            <p>Hi <span th:text="${name}">User</span>!</p>
            <p th:text="${reminderText}">Don't forget your tasks!</p>
            <p th:if="${taskTitle}">
                Task: <strong th:text="${taskTitle}">Task</strong>
            </p>
            <p>
                <a th:href="${link}" class="button">View Your Tasks</a>
            </p>
        </div>
        <div class="footer">
            <p>This is an automated reminder from MyDones.</p>
            <p>© 2026 MyDones. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
